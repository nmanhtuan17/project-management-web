name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
        
    - name: Create .env file
      run: |
        echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
        echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
        echo "VITE_API_KEY=${{ secrets.VITE_API_KEY }}" >> .env
        echo "VITE_AUTH_DOMAIN=${{ secrets.VITE_AUTH_DOMAIN }}" >> .env
        echo "VITE_PROJECT_ID=${{ secrets.VITE_PROJECT_ID }}" >> .env
        echo "VITE_STORAGE_BUCKET=${{ secrets.VITE_STORAGE_BUCKET }}" >> .env
        echo "VITE_MESSAGING_SENDER_ID=${{ secrets.VITE_MESSAGING_SENDER_ID }}" >> .env
        echo "VITE_APP_ID=${{ secrets.VITE_APP_ID }}" >> .env
        echo "VITE_MEASUREMENT_ID=${{ secrets.VITE_MEASUREMENT_ID }}" >> .env
        echo "VITE_VAPID_KEY=${{ secrets.VITE_VAPID_KEY }}" >> .env
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/project-management:latest
        
  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      run: |
        # Write the private key to a file
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        # Create docker-compose.yml
        echo "
        version: '3.8'

        services:
          web:
            image: $DOCKERHUB_USERNAME/project-management:latest
            ports:
              - \"80:80\"
            restart: unless-stopped
            environment:
              - VITE_API_URL=${{ secrets.VITE_API_URL }}
              - VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
              - VITE_API_KEY=${{ secrets.VITE_API_KEY }}
              - VITE_AUTH_DOMAIN=${{ secrets.VITE_AUTH_DOMAIN }}
              - VITE_PROJECT_ID=${{ secrets.VITE_PROJECT_ID }}
              - VITE_STORAGE_BUCKET=${{ secrets.VITE_STORAGE_BUCKET }}
              - VITE_MESSAGING_SENDER_ID=${{ secrets.VITE_MESSAGING_SENDER_ID }}
              - VITE_APP_ID=${{ secrets.VITE_APP_ID }}
              - VITE_MEASUREMENT_ID=${{ secrets.VITE_MEASUREMENT_ID }}
              - VITE_VAPID_KEY=${{ secrets.VITE_VAPID_KEY }}
        " > docker-compose.yml
        
        # Create deployment script
        echo "
          # Login to Docker Hub
          echo \"$DOCKERHUB_PASSWORD\" | docker login -u \"$DOCKERHUB_USERNAME\" --password-stdin
          
          # Pull latest image
          docker-compose pull
          
          # Stop and remove existing containers
          docker-compose down
          
          # Start new containers
          docker-compose up -d
          
          # Clean up unused images
          docker image prune -f
        " > deploy.sh
        
        # Copy files to server
        scp -o StrictHostKeyChecking=no -i private_key.pem docker-compose.yml deploy.sh ${USER}@${HOST}:~/
        
        # Execute deployment script
        ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} '
          chmod +x ~/deploy.sh
          ~/deploy.sh
        '
        
        # Clean up
        rm -f private_key.pem deploy.sh docker-compose.yml 