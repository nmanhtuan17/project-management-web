name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
        
    - name: Create .env file
      run: |
        echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
        echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
        echo "VITE_API_KEY=${{ secrets.VITE_API_KEY }}" >> .env
        echo "VITE_AUTH_DOMAIN=${{ secrets.VITE_AUTH_DOMAIN }}" >> .env
        echo "VITE_PROJECT_ID=${{ secrets.VITE_PROJECT_ID }}" >> .env
        echo "VITE_STORAGE_BUCKET=${{ secrets.VITE_STORAGE_BUCKET }}" >> .env
        echo "VITE_MESSAGING_SENDER_ID=${{ secrets.VITE_MESSAGING_SENDER_ID }}" >> .env
        echo "VITE_APP_ID=${{ secrets.VITE_APP_ID }}" >> .env
        echo "VITE_MEASUREMENT_ID=${{ secrets.VITE_MEASUREMENT_ID }}" >> .env
        echo "VITE_VAPID_KEY=${{ secrets.VITE_VAPID_KEY }}" >> .env
        
    - name: Build application
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        
  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
        
    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        # Write the private key to a file
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        # Create Nginx configuration
        echo "
          server {
              listen 80;
              server_name ${{ secrets.WEB_DOMAIN }};
              
              root /var/www/html;
              index index.html;
              
              location / {
                  try_files \$uri \$uri/ /index.html;
              }
              
              # Security headers
              add_header X-Frame-Options \"SAMEORIGIN\" always;
              add_header X-XSS-Protection \"1; mode=block\" always;
              add_header X-Content-Type-Options \"nosniff\" always;
              add_header Referrer-Policy \"no-referrer-when-downgrade\" always;
              add_header Content-Security-Policy \"default-src 'self' http: https: data: blob: 'unsafe-inline'\" always;
          }
        " > nginx.conf
        
        # Create deployment script
        echo "
          # Update system packages
          sudo apt-get update
          
          # Install Nginx if not installed
          if ! command -v nginx &> /dev/null; then
            sudo apt-get install -y nginx
          fi
          
          # Create web directory if it doesn't exist
          sudo mkdir -p /var/www/html
          
          # Backup current deployment
          if [ -d /var/www/html ]; then
            sudo mv /var/www/html /var/www/html_backup_\$(date +%Y%m%d_%H%M%S)
          fi
          
          # Create new deployment directory
          sudo mkdir -p /var/www/html
          
          # Copy new files
          sudo cp -r ~/dist/* /var/www/html/
          
          # Set proper permissions
          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html
          
          # Copy Nginx configuration
          sudo cp ~/nginx.conf /etc/nginx/sites-available/default
          
          # Test Nginx configuration
          sudo nginx -t
          
          # Restart Nginx
          sudo systemctl restart nginx
          
          # Clean up old backups (keep last 3)
          ls -dt /var/www/html_backup_* | tail -n +4 | xargs -r sudo rm -rf
        " > deploy.sh
        
        # Copy files to server
        scp -o StrictHostKeyChecking=no -i private_key.pem -r dist nginx.conf deploy.sh ${USER}@${HOST}:~/
        
        # Execute deployment script
        ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} '
          chmod +x ~/deploy.sh
          ~/deploy.sh
        '
        
        # Clean up
        rm -f private_key.pem deploy.sh nginx.conf 